<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>{{title}}</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1080px;
  min-height: 1920px;
  background: #f4f7fb;
  color: #243044;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-variant-numeric: tabular-nums;
}

.card {
  width: 1080px;
  min-height: 1920px;
  background: #f4f7fb;
  overflow: hidden;
}

.hero {
  position: relative;
  height: 318px;
  padding: 64px 64px 0;
  color: #ffffff;
  background: linear-gradient(128deg, #155e75 0%, #364f9e 48%, #7c3aed 100%);
  clip-path: polygon(0 0, 100% 0, 100% 84%, 78% 93%, 54% 86%, 28% 98%, 0 89%);
}

.hero h1 {
  font-size: 62px;
  line-height: 1.08;
  font-weight: 760;
  letter-spacing: 0;
}

.hero p {
  margin-top: 18px;
  font-size: 30px;
  line-height: 1.3;
  color: #dbeafe;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 26px;
  padding: 0 64px;
  margin-top: -8px;
}

.metric {
  height: 124px;
  padding: 26px 24px;
  border: 1px solid #dbe3ef;
  border-radius: 8px;
  background: #ffffff;
}

.metric .label {
  color: #6b7a90;
  font-size: 26px;
  font-weight: 650;
}

.metric .value {
  margin-top: 14px;
  color: #155e75;
  font-size: 44px;
  line-height: 1;
  font-weight: 760;
}

.metric.up .value { color: #047857; }
.metric.down .value { color: #b42318; }
.metric.flat .value { color: #475569; }

.panel {
  margin: 36px 64px 0;
  padding: 30px 32px;
  border: 1px solid #dbe3ef;
  border-radius: 8px;
  background: #ffffff;
}

.panel h2 {
  margin-bottom: 20px;
  color: #155e75;
  font-size: 31px;
  line-height: 1.2;
  font-weight: 760;
}

.conclusion {
  color: #1f2937;
  font-size: 31px;
  line-height: 1.55;
  font-weight: 520;
}

.category-row {
  display: grid;
  grid-template-columns: 210px 150px 1fr;
  align-items: center;
  min-height: 44px;
  font-size: 27px;
  line-height: 1.25;
}

.category-name {
  font-weight: 720;
  color: #243044;
}

.category-change {
  font-weight: 760;
}

.category-top {
  color: #64748b;
  font-size: 24px;
}

.rank-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 26px;
  line-height: 1.25;
}

.rank-table thead tr {
  background: #eef3f9;
}

.rank-table th,
.rank-table td {
  padding: 13px 12px;
  text-align: left;
  white-space: nowrap;
}

.rank-table th {
  color: #64748b;
  font-size: 24px;
  font-weight: 720;
}

.rank-table tbody tr:nth-child(even) {
  background: #f8fafc;
}

.rank-table th:first-child,
.rank-table td:first-child {
  border-radius: 8px 0 0 8px;
}

.rank-table th:last-child,
.rank-table td:last-child {
  border-radius: 0 8px 8px 0;
}

.product-name {
  max-width: 190px;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #1f2937;
  font-weight: 720;
}

.change-up { color: #047857; }
.change-down { color: #b42318; }
.change-flat { color: #475569; }

.empty-state,
.empty-row {
  padding: 18px 0;
  color: #64748b;
  font-size: 28px;
}

.compact {
  margin-top: 20px;
}

.compact h2 {
  margin-bottom: 18px;
  font-size: 29px;
}

.mini-row {
  display: grid;
  grid-template-columns: 320px 110px 1fr;
  align-items: center;
  min-height: 46px;
  color: #334155;
  font-size: 25px;
}

.mini-row strong {
  font-weight: 760;
}

.mini-row em {
  color: #64748b;
  font-style: normal;
  font-size: 23px;
}

.footer {
  margin: 28px 64px 0;
  color: #748196;
  font-size: 25px;
  line-height: 1.35;
}
</style>
</head>
<body>
<main class="card">
  <section class="hero">
    <h1>{{title}}</h1>
    <p>{{date}} | 周期 {{period_label}}</p>
  </section>

  <section class="metrics">
    <div class="metric"><div class="label">产品数</div><div class="value">{{product_count}}</div></div>
    <div class="metric up"><div class="label">上涨</div><div class="value">{{rising}}</div></div>
    <div class="metric down"><div class="label">下跌</div><div class="value">{{falling}}</div></div>
    <div class="metric flat"><div class="label">平稳</div><div class="value">{{stable}}</div></div>
  </section>

  <section class="panel">
    <h2>趋势结论</h2>
    <div class="conclusion">{{conclusion}}</div>
  </section>

  <section class="panel">
    <h2>品类趋势</h2>
    {{category_rows}}
  </section>

  <section class="panel">
    <h2>波动排行</h2>
    <table class="rank-table">
      <thead>
        <tr>
          <th>产品</th>
          <th>平台</th>
          <th>当前</th>
          <th>均值</th>
          <th>涨跌</th>
          <th>趋势</th>
        </tr>
      </thead>
      <tbody>
        {{mover_rows}}
      </tbody>
    </table>
  </section>

  {{anomaly_block}}
  {{drift_block}}

  <div class="footer">数据来源：{{source}}｜周报/月报独立于每日播报｜渲染方式：HTML/CSS + 浏览器截图</div>
</main>
</body>
</html>
